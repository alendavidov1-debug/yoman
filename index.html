<style>
/* Layout: native-app shell — grouped lists on a plain ground, fixed bottom tab bar, one orange accent. */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1d2025; --muted:#6c7178; --line:#e2e4e7; --soft:#f3f4f5;

  --tabbar:0px; color-scheme:light;
}
/* the app is white in both modes (alen's choice): gray + red only frame it */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ffffff; --card:#ffffff; --ink:#1d2025; --muted:#6c7178; --line:#e2e4e7; --soft:#f3f4f5;
  --hero:#17181b; --hero-ink:#ffffff; --hero-muted:#a3a6ab;
  --accent:#e10600; --accent-ink:#ffffff; --ok:#1f9d55; --bad:#e10600;

:root[data-theme="dark"]{--bg:#ffffff; --card:#ffffff; --ink:#1d2025; --muted:#6c7178; --line:#e2e4e7; --soft:#f3f4f5;
  --hero:#17181b; --hero-ink:#ffffff; --hero-muted:#a3a6ab;
  --accent:#e10600; --accent-ink:#ffffff; --ok:#1f9d55; --bad:#e10600;
  --prot:#17181b; --carb:#8d9299; --fat:#ff5a52; --kcal:#e10600; color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.75rem;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:600;margin:0}
h3{font-size:1rem;font-weight:600;margin:0}
.n{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hero) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2232%22%20viewBox%3D%220%200%2064%2032%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M14%2016h36%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.35%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M9%209v14M14%206v20M50%206v20M55%209v14%22%20stroke%3D%22%23e10600%22%20stroke-opacity%3D%22.85%22%20stroke-width%3D%224%22/%3E%3C/svg%3E") left 16px center/52px 26px no-repeat;color:var(--hero-ink);padding:14px 16px 12px;margin:-10px -16px 4px;border-bottom:4px solid var(--accent)}.top .btn.link{color:var(--hero-ink)}.top .menubtn{color:var(--hero-ink)}.top .muted,.top .small{color:var(--hero-muted)}
.top h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}

.sync{font-size:.8rem;color:var(--muted)}
.stack{display:grid;gap:20px}
.group{display:grid;gap:8px}

.ghead .lbl{color:var(--ink);opacity:.7;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list{background:var(--card);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}

.item .t{font-weight:500;overflow-wrap:anywhere}

.item .r{font-size:.9rem;color:var(--muted);white-space:nowrap}
button.item{width:100%;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:start;cursor:pointer}

.chev::after{content:"‹";color:var(--muted);font-size:1.3rem;line-height:1}
.pad{padding:14px}
.seg{display:flex;border-bottom:1px solid var(--line);gap:0}
.seg button{flex:1;border:0;background:transparent;font:500 .92rem var(--font);color:var(--muted);padding:7px 8px;border-radius:2px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:inset 0 -4px 0 var(--accent)}
.top:has(.btn){background-image:none}
.btn{font:600 .95rem var(--font);border:0;background:var(--soft);color:var(--ink);border-radius:3px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%;padding:14px;font-size:1rem}
.btn.link{background:none;color:var(--accent);padding:6px 4px}
.btn.del{background:none;color:var(--bad);padding:6px 4px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-inline-end:4px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:.85rem}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:3px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.big{font-size:2rem;font-weight:700;line-height:1.1}
.ring{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.meter{display:grid;gap:6px}
.meter .top2{display:flex;justify-content:space-between;font-size:.88rem}
.track{height:8px;border-radius:2px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--c,var(--accent));border-radius:2px}
.track.over i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi{padding:12px 14px;border-inline-start:1px solid var(--line);display:grid;gap:2px}
.kpi:first-child{border-inline-start:0}
.kpi .k{font-size:.75rem;color:var(--muted)}
.kpi .v{font-size:1.25rem;font-weight:600}
.flag{font-size:.75rem;font-weight:600;color:var(--accent);margin-inline-start:8px}
/* workout logger, Hevy-style set table */
.ex{background:var(--card);border-radius:4px;padding:14px;display:grid;gap:10px}
.ex .name{font-weight:600;color:var(--accent)}
.ex .note{font-size:.85rem;color:var(--muted)}
.settbl{display:grid;gap:4px}
.sr{display:grid;grid-template-columns:30px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;border-radius:2px;padding:2px 0}
.sr.h{font-size:.72rem;color:var(--muted);font-weight:600}
.sr .i{text-align:center;font-weight:600;font-size:.9rem}
.stype{border:0;background:none;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--ink);padding:6px 0;width:100%}
.stype.w{color:var(--carb)}.stype.f{color:var(--bad)}.stype.d{color:var(--prot)}
.prb{font-size:.68rem;font-weight:700;color:var(--accent);display:block;line-height:1}
.exnote{width:100%;font-size:.85rem;padding:6px 8px;border:1px dashed var(--line);background:transparent}
.sr .prev{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr input{padding:8px 4px;text-align:center;font-weight:500}
.sr.done{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.sr.done input{background:transparent}
.chk{width:40px;height:36px;border-radius:2px;border:0;background:var(--soft);cursor:pointer;color:var(--muted);font-size:1rem;font-weight:700}
.sr.done .chk{background:var(--ok);color:#fff}
.hint{font-size:.82rem;color:var(--ok)}.hint.dn{color:#ff8a84}
.mus{display:inline-block;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.exmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.exmeta span{font-size:.8rem;background:var(--soft);border-radius:2px;padding:2px 7px;color:var(--ink)}.exmeta span b{font-weight:600}
.ex.cur{box-shadow:inset 3px 0 0 var(--accent)}.ex.fin{opacity:.6}.ex.fin .name::after{content:" ✓";color:var(--ok)}
.wbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 2px 8px;display:grid;gap:5px}
.wbar .track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.wbar .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.ptbl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto auto;gap:0;font-size:.85rem}
.ptbl>span{padding:7px 6px;border-bottom:1px solid var(--line);min-width:0}.ptbl>span.h{font-size:.75rem;color:var(--muted);font-weight:600}
.ptbl .m{color:var(--muted);overflow-wrap:anywhere}.ptbl .k{white-space:nowrap;text-align:center}
.order{display:flex;gap:4px;flex-wrap:wrap}.order button{flex:1 0 auto;font:inherit;font-size:.85rem;background:var(--card);cursor:pointer;border:1px solid var(--line);border-radius:2px;padding:4px 8px;color:var(--muted)}.order button.on{border-color:var(--accent);color:var(--accent);font-weight:600}.order span.rest{border-style:dashed}
.mgroup{margin-bottom:8px}.mgroup .mhead{background:color-mix(in srgb,var(--accent) 8%,transparent)}.mgroup .mitem{padding-block:9px}.medit{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 8px;border-radius:2px;font:inherit}.medit.tg{flex:.8}.medit.h{font-weight:700}
.plates{display:inline-flex;gap:2px;align-items:center;direction:ltr;vertical-align:middle}
.plates i{display:block;width:7px;border-radius:2px}
.plates em{font-style:normal;font-size:11px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}.plates b{display:block;width:18px;height:5px;background:var(--muted);border-radius:2px}
/* exercise picker */
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.cats{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:2}
.cats button{flex:0 0 auto;border:0;background:none;font:500 .92rem var(--font);color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.cats button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.exthumb{width:56px;height:56px;flex:0 0 auto;border-radius:2px;object-fit:cover;background:#fff;cursor:zoom-in}
.exthumb.sm{width:40px;height:40px}
.exthumb.none{display:grid;place-items:center;color:var(--muted);font-size:.7rem;background:var(--soft)}
.tag{font-size:.75rem;font-weight:600;margin-inline-end:8px}
.tag.f{color:var(--ok)} .tag.w{color:var(--bad)} .tag.r{color:var(--prot)}
.preview img{width:100%;max-height:300px;object-fit:contain;background:#fff;display:block}.preview img.photo{filter:url(#mono)}.preview img.draw{padding:12px}
.bodymap{display:flex;gap:4px;justify-content:center;flex:0 0 auto}.bmap{height:120px;width:60px}
.credit{font-size:.65rem;color:#888;background:#fff;text-align:end;padding:0 8px 4px}
.vol{display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:.88rem;padding:6px 14px}
/* tab bar */
.restbar{position:fixed;inset:auto 0 calc(var(--tabbar) + env(safe-area-inset-bottom,0px)) 0;z-index:8;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.restbar .in{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:4px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-weight:600;}
.restbar .btn{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);padding:6px 10px}
/* weight chart */
svg.chart{direction:ltr}svg.chart text{fill:var(--muted);font:11px var(--font)}
.kpi .v{unicode-bidi:plaintext;text-align:right}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;border-radius:2px;overflow:hidden;cursor:pointer;background:var(--soft);outline:3px solid transparent;outline-offset:-3px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;inset:auto 0 0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.72rem;padding:12px 6px 4px;text-align:start}
.ph[aria-pressed="true"]{outline-color:var(--accent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px}
.thumb{width:42px;height:42px;border-radius:2px;object-fit:cover;flex:0 0 auto}
/* chat */
.chat{display:grid;gap:10px}
.msg{padding:10px 14px;border-inline-start:3px solid var(--line);border-radius:3px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}

.msg.coach{background:var(--card)}
.msg img{max-width:180px;border-radius:3px;display:block;margin-bottom:6px}
.composer{position:sticky;bottom:calc(var(--tabbar) + 8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:flex-end;background:var(--bg);padding-block:8px}
.composer textarea{resize:none;max-height:140px;border-radius:3px;padding:10px 14px}
.iconbtn{flex:0 0 auto;width:42px;height:42px;border-radius:2px;border:0;background:var(--soft);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn.go{background:var(--accent);color:var(--accent-ink)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer;text-align:start}

[hidden]{display:none!important}
.eedit input,.eedit .btn:not(.primary):not(.del):not(.link){background:var(--card);border:1px solid var(--line)}

ל, בצע על ידיות שכיבות סמיכה או על דאמבלים באחיזה ניטרלית."}, "מתח": {"s": "אחיזה מעט רחבה מהכתפיים, כפות פונות קדימה, תלייה מלאה.", "st": ["התחל במשיכת השכמות למטה.", "משוך את המרפקים לכיוון הצלעות עד שהסנטר מעל המוט.", "רד לאט עד יד ישרה."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["חצי טווח תנועה", "נדנוד ובעיטות"], "w": "האחיזה בשמאל עלולה להיגמר לפני הגב. רצועות מותרות, או מעבר לאחיזה ניטרלית."}, "מתח באחיזה ניטרלית / פולי עליון": {"s": "ידית V או ידיות מקבילות, כפות פונות זו לזו.", "st": ["משוך את השכמות למטה.", "משוך את המרפקים לצלעות עד שהחזה העליון מגיע לידית.", "רד לאט עד מתיחה מלאה."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["משיכה עם הידיים בלבד", "הטיה מוגזמת לאחור בפולי"], "w": "האחיזה הכי ידידותית לשורש בתרגילי משיכה. רצועות אם האחיזה בשמאל נכשלת לפני הגב."}, "פולי עליון באחיזה רחבה": {"s": "ברכיים נעולות מתחת לרפידה, אחיזה רחבה בכ-1.5 מרוחב הכתפיים.", "st": ["הטה מעט לאחור.", "משוך את המוט לחזה העליון, מרפקים למטה ואחורה.", "חזור לאט עד ידיים ישרות ומתיחה בלאטים."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["משיכה מאחורי הראש", "תנופה עם הגוף"], "w": "אחוז עם האגודל מסביב למוט, שורש ישר. רצועות אם צריך."}, "פולי עליון ידית V": {"s": "ידית V, ברכיים נעולות, חזה מורם.", "st": ["משוך את הידית לחזה העליון.", "דחוף את המרפקים לאחור ולמטה.", "חזור לאט עד מתיחה מלאה."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["הטיה מוגזמת לאחור", "קיצור טווח בחלק העליון"], "w": "אחיזה ניטרלית, ידידותית לשורש."}, "פולאובר בכבל, ידיים ישרות": {"s": "גלגלת בגובה הכי גבוה, מוט ישר או חבל. צעד 1–2 צעדים אחורה, ברכיים מעט כפופות, נטייה קדימה מהירך (כ-30 מעלות), ידיים כמעט ישרות מעל הראש בקו עם הגוף.", "st": ["מהמתיחה למעלה, הורד את המוט בקשת מעגלית גדולה למטה, ידיים ישרות כל הזמן.", "סיים כשהמוט נוגע בירכיים, וכווץ את הלאטים שנייה.", "החזר באותה קשת לאט, עד שהידיים שוב מעל הראש ומרגישים מתיחה בלאטים."], "b": "נשיפה בהורדה, שאיפה בחזרה למעלה.", "m": ["כיפוף מרפקים (הופך ליד אחורית)", "עמידה זקופה עם ידיים מגובה הכתף בלבד, טווח קצר", "תנועה מהגב התחתון במקום מהכתפיים"], "w": "עם חבל העומס על השורש נמוך. אחיזה קלה, הלאטים עושים את העבודה."}, "חתירה בכבל בישיבה, ידית ניטרלית": {"s": "רגליים על המשטח, ברכיים כפופות קלות, גב ישר, ידית V.", "st": ["משוך את הידית לבטן העליונה.", "כווץ את השכמות זו לזו.", "חזור לאט עד מתיחה בגב, בלי לעגל את הגב התחתון."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["נדנוד גדול עם הגוף", "כתפיים עולות לאוזניים"], "w": "אחיזה ניטרלית מורידה עומס מהשורש. רצועות אם האחיזה בשמאל נכשלת לפני הגב."}, "חתירה חד-ידית בדאמבל (שמאל קודם)": {"s": "ברך ויד אחת על ספסל, גב ישר ומקביל לרצפה, דאמבל ביד השנייה.", "st": ["משוך את הדאמבל לכיוון הירך, המרפק צמוד לגוף.", "כווץ את הגב שנייה.", "רד לאט עד יד ישרה ומתיחה."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["סיבוב של הגוף", "משיכה לכיוון החזה במקום לירך"], "w": "התחל בשמאל, ובימין עשה בדיוק אותו מספר חזרות. רצועה אם האחיזה נכשלת."}, "חתירה במכונה עם תמיכת חזה": {"s": "חזה צמוד לרפידה, כוון כך שהידיות בהישג יד עם מתיחה.", "st": ["משוך את הידיות לאחור עד שהמרפקים מאחורי הגוף.", "כווץ את השכמות.", "חזור לאט."], "b": "שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.", "m": ["הרמת החזה מהרפידה", "טווח קצר"], "w": "התמיכה בחזה מאפשרת להתרכז בגב. בחר ידיות ניטרליות."}, "חתירת T-בר": {"s": "עמוד מעל המוט, ברכיים כפופות, גב ישר בזווית של כ-45°. ידית V או ידיות מקבילות.", "st": ["משוך את המוט לחזה התחתון.", "כווץ את השכמות.", "רד לאט עד יד ישרה."], "b": "שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.", "m": ["עיגול הגב התחתון", "קימה עם הגוף בכל חזרה"], "w": "ידית ניטרלית עוזרת לשורש. רצועות בסטים הכבדים."}, "חתירה במוט": {"s": "אחיזה ברוחב כתפיים, ברכיים כפופות, גוף נוטה קדימה כ-45° עם גב ישר.", "st": ["משוך את המוט לבטן העליונה.", "מרפקים לאחור, שכמות נסגרות.", "רד לאט בלי לשנות את זווית הגוף."], "b": "שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.", "m": ["גב מעוגל", "קימה של הגוף לכל חזרה"], "w": "שו
