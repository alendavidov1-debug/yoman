function lastSessionFor(name) {

    const ex = (S.workouts[i].exercises || []).find(e => e.name === name && e.sets?.some(s => s.reps && work(s)));
    if (ex) return { date: S.workouts[i].date, sets: ex.sets.filter(s => s.reps && work(s)) };
  }

}
function suggest(ex) {

      c.toBlob(b => { URL.revokeObjectURL(url); res(b || file); }, "image/jpeg", 0.85); };
    img.onerror = () => res(file); img.src = url;
  });
}

async function autoCheckin() { // weekly, automatic: calories follow the real weekly-average trend (MacroFactor-style, ≤150 kcal/week)

  if (!(await save("settings/profile", { ...S.profile, kcalAuto: ci.next, lastCheckin: today() }))) return;
  const want = goalPct(S.profile) / 100 * (latestWeight() || 0), r = ci.rate;
  const text = ci.next === ci.cur ? `בדיקה שבועית: הקצב שלך ${r == null ? "תקין" : `${r1(r)} ק"ג בשבוע`} מול יעד ${r1(want)}. היעד נשאר ${ci.cur} קק"ל.`
    : `בדיקה שבועית: עדכנתי את היעד ל-${ci.next} קק"ל (היה ${ci.cur}). ${r == null ? "" : `הקצב בפועל ${r1(r)} ק"ג בשבוע מול יעד ${r1(want)}.`} התפריט הותאם בהתאם.`;
  const msg = { role: "coach", text, ts: Date.now() }; S.chat.push(msg); addTo("chat", msg); S.coachUnread = true; store.set("coachUnread", true); toast(ci.next === ci.cur ? "בדיקה שבועית: היעד נשאר" : `היעד עודכן ל-${ci.next} קק״ל`); render();

שב כך שהידיות בגובה החזה. מרפקים מעט כפופים וקבועים.","st":["קרב את הידיות בחצי עיגול מול החזה.","כווץ את החזה שנייה.","חזור לאט עד מתיחה, בלי לפתוח מעבר לקו הכתף."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["פתיחה עמוקה מדי (עומס על הכתף)","דחיפה עם הידיים במקום חיבוק"],"w":"עם ידיות אנכיות או רפידות למרפקים העומס על השורש כמעט אפסי."},"קרוס אובר בכבל (מלמעלה למטה)":{"s":"גלגלות למעלה, צעד אחד קדימה, גוף נוטה מעט קדימה, מרפקים כפופים קלות.","st":["משוך את הידיות בקשת למטה ופנימה, לכיוון הטבור.","הצלב מעט את הידיים בסוף.","חזור לאט עד מתיחה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["כיפוף מרפקים משתנה (הופך ללחיצה)","משקל כבד מדי שמושך את הגוף"],"w":"אחיזה רפויה, שורש ישר. התרגיל מעמיס על החזה ולא על האמה."},"קרוס אובר בכבל (מלמטה למעלה)":{"s":"גלגלות למטה, צעד קדימה, מרפקים כפופים קלות.","st":["הרם את הידיות בקשת למעלה ופנימה, לגובה הסנטר.","כווץ את החזה העליון.","חזור לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["הרמת הכתפיים","שימוש בתנופה"],"w":"עומס נמוך על השורש. טוב לחזה עליון בלי לחיצת מוט."},"מקבילים לחזה":{"s":"אחוז במקבילים, ידיים ישרות, רגליים מאחור, גוף נוטה קדימה כ-30°.","st":["רד בשליטה עד שהכתף מעט מתחת למרפק.","מרפקים מעט החוצה.","דחוף למעלה עד יד ישרה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["ירידה עמוקה מדי עם כתף שנופלת קדימה","גוף זקוף (הופך ליד אחורית)"],"w":"כל משקל הגוף על השורש בפשיטה. עם יד שמאל חלשה, עדיף מכונת מקבילים או קרוס אובר מלמעלה."},"שכיבות סמיכה":{"s":"כפות ידיים מעט רחבות מהכתפיים, גוף בקו ישר מהראש לעקבים, בטן וישבן מכווצים.","st":["רד עד שהחזה כמעט נוגע ברצפה, מרפקים 45°.","דחוף למעלה כיחידה אחת.","אל תיתן לאגן לשקוע."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["אגן שוקע או מתרומם","ראש נופל קדימה"],"w":"שורש בפשיטה מלאה. עם כאב בשמאל, בצע על ידיות שכיבות סמיכה או על דאמבלים באחיזה ניטרלית."},"מתח":{"s":"אחיזה מעט רחבה מהכתפיים, כפות פונות קדימה, תלייה מלאה.","st":["התחל במשיכת השכמות למטה.","משוך את המרפקים לכיוון הצלעות עד שהסנטר מעל המוט.","רד לאט עד יד ישרה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["חצי טווח תנועה","נדנוד ובעיטות"],"w":"האחיזה בשמאל עלולה להיגמר לפני הגב. רצועות מותרות, או מעבר לאחיזה ניטרלית."},"מתח באחיזה ניטרלית / פולי עליון":{"s":"ידית V או ידיות מקבילות, כפות פונות זו לזו.","st":["משוך את השכמות למטה.","משוך את המרפקים לצלעות עד שהחזה העליון מגיע לידית.","רד לאט עד מתיחה מלאה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה עם הידיים בלבד","הטיה מוגזמת לאחור בפולי"],"w":"האחיזה הכי ידידותית לשורש בתרגילי משיכה. רצועות אם האחיזה בשמאל נכשלת לפני הגב."},"פולי עליון באחיזה רחבה":{"s":"ברכיים נעולות מתחת לרפידה, אחיזה רחבה בכ-1.5 מרוחב הכתפיים.","st":["הטה מעט לאחור.","משוך את המוט לחזה העליון, מרפקים למטה ואחורה.","חזור לאט עד ידיים ישרות ומתיחה בלאטים."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה מאחורי הראש","תנופה עם הגוף"],"w":"אחוז עם האגודל מסביב למוט, שורש ישר. רצועות אם צריך."},"פולי עליון ידית V":{"s":"ידית V, ברכיים נעולות, חזה מורם.","st":["משוך את הידית לחזה העליון.","דחוף את המרפקים לאחור ולמטה.","חזור לאט עד מתיחה מלאה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["הטיה מוגזמת לאחור","קיצור טווח בחלק העליון"],"w":"אחיזה ניטרלית, ידידותית לשורש."},"פולאובר בכבל, ידיים ישרות":{"s":"גלגלת גבוהה עם מוט ישר או חבל. צעד אחורה, גוף נוטה קדימה, ידיים כמעט ישרות.","st":["משוך את המוט בקשת למטה עד הירכיים.","כווץ את הלאטים.","חזור לאט עד מתיחה מעל הראש."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["כיפוף מרפקים (הופך ליד אחורית)","תנועה מהגב התחתון"],"w":"עם חבל העומס על השורש נמוך. אחיזה קלה, הלאטים עושים את העבודה."},"חתירה בכבל בישיבה, ידית ניטרלית":{"s":"רגליים על המשטח, ברכיים כפופות קלות, גב ישר, ידית V.","st":["משוך את הידית לבטן העליונה.","כווץ את השכמות זו לזו.","חזור לאט עד מתיחה בגב, בלי לעגל את הגב התחתון."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["נדנוד גדול עם הגוף","כתפיים עולות לאוזניים"],"w":"אחיזה ניטרלית מורידה עומס מהשורש. רצועות אם האחיזה בשמאל נכשלת לפני הגב."},"חתירה חד-ידית בדאמבל (שמאל קודם)":{"s":"ברך ויד אחת על ספסל, גב ישר ומקביל לרצפה, דאמבל ביד השנייה.","st":["משוך את הדאמבל לכיוון הירך, המרפק צמוד לגוף.","כווץ את הגב שנייה.","רד לאט עד יד ישרה ומתיחה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["סיבוב של הגוף","משיכה לכיוון החזה במקום לירך"],"w":"התחל בשמאל, ובימין עשה בדיוק אותו מספר חזרות. רצועה אם האחיזה נכשלת."},"חתירה במכונה עם תמיכת חזה":{"s":"חזה צמוד לרפידה, כוון כך שהידיות בהישג יד עם מתיחה.","st":["משוך את הידיות לאחור עד שהמרפקים מאחורי הגוף.","כווץ את השכמות.","חזור לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["הרמת החזה מהרפידה","טווח קצר"],"w":"התמיכה בחזה מאפשרת להתרכז בגב. בחר ידיות ניטרליות."},"חתירת T-בר":{"s":"עמוד מעל המוט, ברכיים כפופות, גב ישר בזווית של כ-45°. ידית V או ידיות מקבילות.","st":["משוך את המוט לחזה התחתון.","כווץ את השכמות.","רד לאט עד יד ישרה."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["עיגול הגב התחתון","קימה עם הגוף בכל חזרה"],"w":"ידית ניטרלית עוזרת לשורש. רצועות בסטים הכבדים."},"חתירה במוט":{"s":"אחיזה ברוחב כתפיים, ברכיים כפופות, גוף נוטה קדימה כ-45° עם גב ישר.","st":["משוך את המוט לבטן העליונה.","מרפקים לאחור, שכמות נסגרות.","רד לאט בלי לשנות את זווית הגוף."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["גב מעוגל","קימה של הגוף לכל חזרה"],"w":"שורש ישר, אגודל מסביב למוט. אם שמאל מגביל, עבור לחתירת T-בר או למכונה."},"פולאובר בדאמבל":{"s":"שכב לרוחב או לאורך ספסל, דאמבל אחד בשתי הידיים מעל החזה, מרפקים מעט כפופים.","st":["הורד את הדאמבל בקשת מאחורי הראש עד מתיחה.","החזר בקשת מעל החזה.","שמור על אגן יציב."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["כיפוף מרפקים משתנה","ירידה מעבר לטווח הנוח לכתף"],"w":"החזק את הדאמבל בכפות פתוחות סביב הדסקה, בלי לקפל את השורש."},"שראגס בדאמבלים":{"s":"עמידה זקופה, דאמבלים בצד הגוף.","st":["הרם את הכתפיים ישר למעלה לכיוון האוזניים.","החזק שנייה.","רד לאט עד מתיחה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["סיבוב כתפיים","כיפוף מרפקים"],"w":"החזקת דאמבלים מעמיסה על האחיזה. רצועות מותרות, ועם שמאל חלשה עדיף מכונה או מוט טראפ."},"שראגס במוט":{"s":"מוט מול הירכיים, אחיזה ברוחב כתפיים.","st":["הרם את הכתפיים ישר למעלה.","החזק שנייה.","רד לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["תנופה מהברכיים","סיבוב כתפיים"],"w":"רצועות מומלצות, כדי שהטרפז יעבוד ולא האחיזה."},"היפר-אקסטנשן":{"s":"רפידה בגובה עצם האגן, רגליים נעולות, ידיים על החזה.","st":["רד לאט עם גב ישר עד כיפוף של כ-90° במותן.","עלה עד קו ישר עם הרגליים, לא מעבר.","כווץ ישבן בסוף."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["קשת מוגזמת למעלה","תנופה"],"w":"ידיים על החזה, אין עומס על השורש. אפשר להחזיק דסקה."},"גוד מורנינג":{"s":"מוט על הגב העליון כמו בסקוואט, ברכיים כפופות קלות.","st":["דחוף את האגן לאחור, גב ישר, עד שהגוף כמעט מקביל לרצפה.","חזור למעלה בדחיפת האגן קדימה."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["עיגול הגב","כיפוף ברכיים גדול מדי"],"w":"כמו בסקוואט: אחיזה רחבה, אגודל מעל המוט ומרפקים למטה כדי שהשורש יישאר ישר."},"רק פול (דדליפט חלקי)":{"s":"מוט על פינים בגובה הברך, אחיזה ברוחב כתפיים, גב ישר.","st":["דחוף את הרצפה ונעל ירכיים וכתפיים יחד.","עמוד זקוף בלי להטות לאחור.","החזר בשליטה לפינים."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["משיכה עם גב מעוגל","הטיה לאחור בסוף"],"w":"רצועות בסטים הכבדים. בלי אחיזה מעורבת."},"לחיצת כתפיים בדאמבלים, אחיזה ניטרלית":{"s":"ספסל זקוף או כמעט זקוף, דאמבלים בגובה הכתפיים, כפות פונות זו לזו.","st":["דחוף למעלה עד ידיים כמעט ישרות מעל הראש.","רד לאט לגובה הסנטר.","בטן מכווצת, בלי קשת בגב התחתון."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["קשת מוגזמת בגב","ירידה חלקית"],"w":"אחיזה ניטרלית מורידה את הפשיטה בשורש. עדיפה בהרבה על מוט במצבך."},"לחיצת כתפיים במכונה":{"s":"כוון את המושב כך שהידיות בגובה הכתפיים, גב צמוד למשענת.","st":["דחוף למעלה עד כמעט נעילה.","רד לאט לגובה הסנטר."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["מושב נמוך מדי","הרמת הכתפיים לאוזניים"],"w":"בחר ידיות ניטרליות אם יש. מסלול קבוע ופחות ייצוב."},"לחיצת כתפיים במוט":{"s":"עמידה ברוחב אגן, מוט על הכתפיים הקדמיות, אחיזה מעט רחבה מהכתפיים, ישבן ובטן מכווצים.","st":["דחוף את המוט ישר למעלה, הזז את הראש מעט לאחור כדי לפנות דרך.","בסוף, הראש מתחת למוט וידיים ישרות.","רד בשליטה לכתפיים."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["קשת חזקה בגב התחתון","מוט שנע קדימה הרחק מהגוף"],"w":"עומס פשיטה גדול על השורש. במצבך עדיף דאמבלים באחיזה ניטרלית או מכונה."},"הרחקת כתפיים בדאמבלים":{"s":"עמידה, דאמבלים קלים בצד הגוף, מרפקים כפופים קלות, גוף נוטה מעט קדימה.","st":["הרם את הידיים לצדדים עד גובה הכתף.","הובל עם המרפקים, לא עם כפות הידיים.","רד לאט, 2–3 שניות."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["תנופה עם הגוף","הרמת הכתפיים לאוזניים","משקל כבד מדי"],"w":"אחיזה רפויה. אפשר גם בכבל או במכונה."},"הרחקת כתפיים בכבל":{"s":"גלגלת נמוכה, עמידה בצד המכונה, הידית ביד הרחוקה.","st":["הרם את היד לצד עד גובה הכתף.","החזק רגע.","רד לאט עד שהיד חוצה את הגוף."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה עם הטרפז","סיבוב הגוף"],"w":"עומס קל על השורש. התחל בשמאל."},"הרמה קדמית בדאמבל":{"s":"עמידה, דאמבל ביד או בשתי ידיים מול הירכיים.","st":["הרם קדימה עד גובה הכתף, מרפק כפוף קלות.","רד לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["תנופה מהגב","הרמה מעל גובה הראש"],"w":"אפשר לאחוז בדסקה בשתי ידיים באחיזה ניטרלית. רוב המתאמנים לא צריכים את התרגיל הזה אם הם לוחצים."},"פייס פול בחבל":{"s":"גלגלת בגובה הפנים או מעט מעל, חבל, אחיזה עם האגודלים לכיוונך.","st":["משוך את החבל לכיוון המצח, ידיים נפרדות לצדדי הראש.","סובב את הכתפיים החוצה בסוף (כמו הצגת שרירים).","חזור לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה לחזה במקום לפנים","משקל כבד שמונע סיבוב חיצוני"],"w":"עומס נמוך על השורש. טוב לבריאות הכתף."},"פרפר אחורי":{"s":"שב בקצה ספסל, גוף נוטה קדימה, דאמבלים קלים מתחת לירכיים.","st":["הרם את הידיים לצדדים, מרפקים כפופים קלות.","כווץ את הכתף האחורית.","רד לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה עם השכמות במקום עם הכתף האחורית","תנופה"],"w":"דאמבלים קלים ואחיזה רפויה. בכבל או במכונה העומס על האמה נמוך עוד יותר."},"פרפר אחורי בכבל":{"s":"שתי גלגלות בגובה הכתף, אחוז בכבלים מוצלבים (ימין ביד שמאל ולהפך) בלי ידיות.","st":["משוך את הידיים לצדדים ולאחור בקו הכתפיים.","עצור כשהידיים בקו הגוף.","חזור לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משיכה עם המרפקים כפופים מדי","סיבוב הגוף"],"w":"ללא ידיות, כמעט אין עומס על השורש."},"סיבוב חיצוני בכבל":{"s":"גלגלת בגובה המרפק, עמידה בצד, מרפק צמוד לגוף ב-90°. מגבת קטנה בין המרפק לגוף.","st":["סובב את האמה החוצה והרחק מהבטן.","החזק שנייה.","חזור לאט."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["התרחקות המרפק מהגוף","משקל כבד"],"w":"משקל קל מאוד. השורש ישר ואין עליו עומס."},"סקוואט אחורי (מוט גבוה)":{"s":"מוט על הטרפז העליון, רגליים ברוחב כתפיים, כפות רגליים מעט החוצה.","st":["שאף, נעל בטן, ושבור בו-זמנית ברך ואגן.","רד עד שהירך לפחות מקבילה לרצפה, ברכיים בכיוון האצבעות.","דחוף את הרצפה וקום כשהחזה מורם."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["ברכיים קורסות פנימה","עקבים מתרוממים","גב תחתון מתעגל בתחתית"],"w":"אחיזה רחבה יותר, אגודל מעל המוט ומרפקים מכוונים למטה. המוט יושב על הגב, לא בידיים. אם יש כאב, מוט SSB או סמית'."},"סקוואט קדמי":{"s":"מוט על הכתפיים הקדמיות, מרפקים גבוהים.","st":["שאף ונעל בטן.","רד ישר למטה עם גב זקוף.","קום כשהמרפקים נשארים גבוהים."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["מרפקים נופלים","גב מתעגל קדימה"],"w":"אחיזת ההרמה מכופפת את השורש מאוד. במצבך השתמש באחיזת ידיים מוצלבות או ברצועות סביב המוט, או החלף לסקוואט גביע או האק סקוואט."},"סקוואט בסמית'":{"s":"מוט על הגב העליון, רגליים מעט קדימה מהמוט.","st":["שחרר את הנעילה.","רד עד ירך מקביל ידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["מרפקים נפתחים לצדדים","קשת בגב"],"w":"מתיחה מלאה לראש הארוך. חבל, אחיזה רפויה."},"לחיצה צרפתית במוט EZ":{"s":"שכיבה על ספסל, מוט EZ מעל המצח, ידיים מעט מוטות לאחור.","st":["כופף את המרפקים והורד את המוט מעל הראש.","יישר את הידיים בחזרה.","מרפקים לא נפתחים לצדדים."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["מרפקים נפתחים","משקל כבד מדי (עומס על המרפק)"],"w":"עומס על השורש. במצבך עדיף פשיטה בכבל מעל הראש עם חבל."},"לחיצת חזה באחיזה צרה":{"s":"כמו לחיצת חזה, אחיזה ברוחב כתפיים, מרפקים צמודים לגוף.","st":["הורד את המוט לחזה התחתון.","מרפקים קרובים לצלעות.","דחוף עד נעילה."],"b":"שאיפה עמוקה לבטן ונעילת הבטן לפני כל חזרה, נשיפה אחרי שעוברים את הנקודה הקשה.","m":["אחיזה צרה מדי (עומס על השורש)","מרפקים נפתחים"],"w":"אחיזה צרה מדי מקפלת את השורש. במצבך עדיף בדאמבלים באחיזה ניטרלית צמודה."},"מקבילים ליד אחורית":{"s":"אחוז במקבילים, גוף זקוף, ידיים ישרות.","st":["רד עד מרפק ב-90°, גוף זקוף.","דחוף למעלה עד יד ישרה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["ירידה עמוקה מדי","כתפיים עולות לאוזניים"],"w":"כל משקל הגוף על השורש. עם שמאל חלשה, עדיף פשיטה בכבל."},"כפיפת שורש כף יד בדאמבל (שמאל קודם)":{"s":"שב, אמה על הירך או על ספסל, כף היד פונה למעלה ובולטת מעבר לקצה.","st":["הורד את הדאמבל לאט ככל שהשורש מאפשר.","כופף את השורש למעלה עד הסוף.","תנועה איטית, 2 שניות למעלה ו-2 למטה."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["תנופה מהמרפק","משקל כבד מדי"],"w":"תרגיל שיקום. התחל במשקל קל מאוד (2–5 ק״ג). כאב עד 3/10 שחולף תוך יום מקובל, מעבר לזה עצור. ימין עושה בדיוק אותן חזרות ומשקל כמו שמאל."},"פשיטת שורש כף יד בדאמבל (שמאל קודם)":{"s":"כמו כפיפת שורש, אבל כף היד פונה למטה.","st":["הורד את כף היד לאט.","הרם את גב כף היד למעלה עד הסוף.","תנועה איטית ומבוקרת."],"b":"שאיפה בשלב הירידה (האקסצנטרי), נשיפה בשלב המאמץ.","m":["משקל כבד מדי","תנועה מהמרפק"],"w":"השריר הזה לרוב החלש יותר. משקל קל מאוד, אפילו 1–3 ק״ג. כלל כאב 3/10."},"כפיפת מרפק הפוכה":{"s":"עמידה, דאמבלים או מוט EZ באחיזה עלי function pickFile(accept) { return new Promise(res => { const f = document.createElement("input"); f.type = "file"; f.accept = accept; f.style.display = "none"; f.onchange = () => { res(f.files[0] || null); f.remove(); }; document.body.append(f); f.click(); }); }
async function exportBackup() {
  if (!S.db) return toast("אין חיבור לנתונים");
  if (!S.downloads) return toast("שמירה לא זמינה כאן");
  toast("מכין גיבוי…");
  const docs = {}, blobs = {};
  for (const p of BK_DOCS) { const d = await S.db.doc(p).get(); if (d.exists) docs[p] = d.data(); }
  for (const c of BK_COLS) for (const d of (await S.db.collection(c).get()).docs) docs[c + "/" + d.id] = d.data();
  const ids = new Set(); Object.entries(docs).forEach(([k, v]) => { if (k.startsWith("photos/") && v?.assetId) ids.add(v.assetId); if (k.startsWith("chat/") && v?.img) ids.add(v.img); });
  let miss = 0; for (const id of ids) { try { blobs[id] = await toDataUrl(await (await fetch(src(id))).blob()); } catch { miss++; } }
  const data = JSON.stringify({ app: "yoman", v: 1, exported: new Date().toISOString(), docs, blobs });
  try { await S.downloads.save({ filename: `yoman-backup-${today()}.json`, data: new Blob([data], { type: "application/json" }) });
    store.set("lastBackup", Date.now()); try { localStorage.removeItem("dirty"); } catch {}
    S.bkOpen = true; render(); toast(`הגיבוי נשמר: ${Object.keys(docs).length} רשומות${ids.size ? `, ${ids.size - miss} תמונות` : ""}`);
  } catch (e) { if (e?.code !== "declined") toast("השמירה נכשלה"); }
}
async function importBackup() {
  if (!S.db) return toast("אין חיבור לנתונים");
  const f = await pickFile(".json,application/json"); if (!f) return;
  let B; try { B = JSON.parse(await f.text()); } catch { return toast("הקובץ לא תקין"); }
  if (B?.app !== "yoman" || !B.docs) return toast("זה לא קובץ גיבוי של האפליקציה");
  const n = Object.keys(B.docs).length;
  if (!confirm(`לייבא ${n} רשומות מגיבוי ${String(B.exported || "").slice(0, 10)}?\nרשומות עם אותו מזהה יוחלפו, כל השאר יישאר.`)) return;
  toast("מייבא…"); const map = {};
  for (const [id, url] of Object.entries(B.blobs || {})) { try { const b = await (await fetch(url)).blob(); map[id] = S.db.blobs ? (await S.db.blobs.put(id, b), id) : S.assets ? (await S.assets.upload(b)).id : null; } catch {} }
  let ok = 0;
  for (const [p, v] of Object.entries(B.docs)) { if (p === "meta/ping" || !v) continue; let d = v;
    if (p.startsWith("photos/") && d.assetId && map[d.assetId]) d = { ...d, assetId: map[d.assetId] };
    if (p.startsWith("chat/") && d.img && map[d.img]) d = { ...d, img: map[d.img] };
    try { await S.db.doc(p).set(d); ok++; } catch {} }
  S.ob = null; S.bkOpen = true; render(); toast(ok === n ? `יובאו כל ${n} הרשומות` : `יובאו ${ok} מתוך ${n} רשומות`);
}
function backupBlock() {
  const last = store.get("lastBackup", null), old = !last || Date.now() - last > 7 * 864e5, dirty = (() => { try { return !!localStorage.getItem("dirty"); } catch { return false; } })(), key = store.get("apiKey", "");
  return `<details class="group" ${S.bkOpen ? "open" : ""}><summary class="ghead"><span class="lbl">גיבוי ונתונים</span><span class="small" style="color:var(--accent)">${S.pwa && dirty && old ? "מומלץ לגבות" : "פתיחה"}</span></summary>
    <div class="list pad" style="display:grid;gap:12px">
      <div class="small muted">${S.pwa ? `הנתונים נשמרים במכשיר הזה בלבד${S.persisted ? ", באחסון קבוע" : ""}. גיבוי אחרון: ${last ? new Date(last).toLocaleDateString("he-IL") : "עוד לא"}. כדאי לשמור גיבוי ב-iCloud פעם בשבוע.` : "קובץ גיבוי מלא: כל הנתונים והתמונות. משמש להעברה לאפליקציה המותקנת."}</div>
      <div class="row"><button class="btn primary" id="bkExport">ייצוא גיבוי</button><button class="btn" id="bkImport">ייבוא מגיבוי</button></div>
      ${S.pwa ? `<div class="row sb"><span class="small muted">גרסה ${esc(String(window.__APPVER || "").slice(0, 7))}${S.newVer ? " · יש גרסה חדשה" : ""}</span><button class="btn" id="upChk">${S.newVer ? "עדכון עכשיו" : "בדיקת עדכון"}</button></div>` : ""}
      ${S.pwa ? `<label class="f">מפתח Anthropic API (מאמן AI וחישוב אוכל)<input id="apiKey" dir="ltr" type="password" autocomplete="off" spellcheck="false" placeholder="${key ? "המפתח שמור · הדבק חדש להחלפה" : "sk-ant-…"}"></label>
      <div class="row"><button class="btn" id="apiSave">שמירת מפתח</button>${key ? `<button class="btn del" id="apiDel">הסרת המפתח</button>` : ""}</div>` : ""}
    </div></details>`;
}

/* ---------- boot ---------- */
let rt; const soon = () => { clearTimeout(rt); rt = setTimeout(() => { if (!S.chatBusy) render(); }, 50); };
render();
(async () => {
  let db;
  if (!window.claude?.use) { db = await bootPwa(); if (!db) { S.loaded = true; render(); return; } } else {
  const [raw, assets, sample, downloads, user] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("sample"), claude.use("downloads"), claude.use("user")]);
  S.assets = assets; S.sample = sample; S.downloads = downloads; S.user = user;
  const uid = raw && user ? await user.id().catch(() => null) : null;
  const P = `data/users/${uid}/app/`; // each signed-in person gets a private space
  S.guest = !raw || !uid; // not signed in: work fully, data stays on this device
  db = S.guest ? localDb() : { doc: path => raw.doc(P + path), collection: name => raw.collection(P + name) };
  if (!S.guest) try { await db.doc("meta/ping").set({ t: Date.now() }); } catch { S.guest = true; db = localDb(); } // signed in but only view access: same as a guest
  S.db = db; S.live = true; render(); if (S.guest) setTimeout(() => toast("מצב אורח: נשמר רק במכשיר הזה"), 2600);
  try { await setupUser(raw, db, S.guest ? { isOwner: async () => false } : user); } catch { toast("ההגדרה הראשונית נכשלה, נסה לרענן"); }
  S.isOwner = !S.guest && await user.isOwner().catch(() => false); S.meName = S.guest ? "" : (await user?.me?.().catch(() => null))?.name || ""; store.set("meName", myName()); render();
  }
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0);
  const col = (name, sort) => db.collection(name).onSnapshot(s => { S[name] = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(sort); soon(); }, () => toast("החיבור נקטע"));
  db.collection("plans").onSnapshot(s => { if (S.planBusy) return; S.plans = s.docs.map(d => ({ id: d.id, ...d.data() })); soon(); }); col("weights", byDate); col("measures", byDate); col("food", byDate); col("workouts", byDate); col("photos", byDate); col("daily", byDate);
  col("meals", (a, b) => (a.name || "").localeCompare(b.name || "", "he"));
  db.collection("chat").onSnapshot(s => { if (!S.chatBusy) { S.chat = [...s.docs.map(d => ({ id: d.id, ...d.data() })), ...S.chat.filter(m => m.local)].sort((a, b) => a.ts - b.ts); soon(); } });
  db.doc("settings/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : null; S.loaded = true; soon(); });
  setTimeout(autoCheckin, 5000);
  db.doc("plan/main").onSnapshot(s => { if (!S.editPlan && !S.planBusy) { S.plan = s.exists ? s.data() : null; soon(); } });
  db.doc("menu/main").onSnapshot(s => { if (S.menuEdit) return; S.menu = s.exists ? s.data() : null; soon(); });
})();
})();
</script>
